services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stock_book
      POSTGRES_USER: stock_book
      POSTGRES_PASSWORD: stock_book
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_book -d stock_book"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
