spring:
  application:
    name: stock-book
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_book}
    username: ${DB_USER:stock_book}
    password: ${DB_PASSWORD:stock_book}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    enabled: true
    url: ${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/stock_book}}
    user: ${MIGRATION_DB_USER:${DB_USER:stock_book}}
    password: ${MIGRATION_DB_PASSWORD:${DB_PASSWORD:stock_book}}
  session:
    jdbc:
      initialize-schema: never
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        name: STOCKBOOK_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
